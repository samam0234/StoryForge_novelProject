# 값의 기준은 docs/plan/CURRENT_STACK.md. 실제 값은 환경 변수로 주입합니다.
server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: storyforge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/storyforge}
    username: ${DB_USER:storyforge}
    password: ${DB_PASSWORD:storyforge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    async:
      # 챕터 생성 SSE 중계 (기획서 §4: P95 < 90초)
      request-timeout: 180s

storyforge:
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    timeout: 180s
  # AI 서비스의 LLM_PROVIDER와 같은 값이어야 외부 전송 안내가 맞습니다.
  llm:
    provider: ${LLM_PROVIDER:mock}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:4200}
  rate-limit:
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    generate-per-minute: ${RATE_LIMIT_GENERATE_PER_MINUTE:30}
    community-per-minute: ${RATE_LIMIT_COMMUNITY_PER_MINUTE:60}
  # 비우면 X-Forwarded-For를 믿지 않습니다. rate-limit 설정 객체와 분리해 둡니다.
  client-ip:
    trusted-proxies: ${TRUSTED_PROXIES:}
  moderation:
    # 쉼표로 구분한 금지 표현. 비우면 검사하지 않습니다.
    blocklist: ${CONTENT_BLOCKLIST:}
  admin:
    # 이 이메일은 가입·로그인 때 관리자가 됩니다. 쉼표로 여러 주소를 넣을 수 있습니다.
    emails: ${ADMIN_EMAILS:}
  community:
    # 작업 그래프와 활동 잔디의 날짜 기준 시간대
    zone: ${COMMUNITY_ZONE:Asia/Seoul}
  collab:
    # 가이드챗의 콜라보 이동 주소. 비우면 이동 버튼을 표시하지 않습니다.
    codicomperchat-url: ${CODICOMPERCHAT_URL:}
  jwt:
    # 비우면 시작할 때 무작위 키를 만듭니다. 운영에서는 반드시 지정 (docs/plan/auth.md)
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:12h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
