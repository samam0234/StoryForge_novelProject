# 운영 프로필. `spring.profiles.active=prod` 일 때만 적용됩니다.
# 개발 기본값을 쓰지 않습니다. 빠진 값은 시작 실패로 드러냅니다.
# 기준: SECURITY.md 배포 전 체크리스트, docs/plan/CURRENT_STACK.md

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

storyforge:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN}
  jwt:
    secret: ${JWT_SECRET}
