# 개발용 인프라 (기획서 §12: Docker Compose). 포트 기준값은 docs/plan/CURRENT_STACK.md
services:
  postgres:
    image: postgres:16
    container_name: storyforge-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-storyforge}
      POSTGRES_USER: ${DB_USER:-storyforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storyforge}
    ports:
      # 로컬에 이미 5432를 쓰는 PostgreSQL이 있어 5433을 사용합니다.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - storyforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-storyforge} -d ${DB_NAME:-storyforge}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  storyforge-pgdata:
