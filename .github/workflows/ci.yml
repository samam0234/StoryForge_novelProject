name: CI

# develop, main으로 가는 푸시와 PR에서 네 서비스의 테스트와 두 Angular 빌드를 확인합니다.
# 실제 LLM은 호출하지 않습니다 (mock과 가짜 LLM만 사용). 시크릿이 필요 없습니다.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: storyforge-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 통합 테스트는 Testcontainers로 실제 PostgreSQL을 띄웁니다. ubuntu-latest에는 Docker가 있습니다.
      - run: ./mvnw -B test

  ai:
    name: ai (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: storyforge-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            storyforge-ai/requirements.txt
            storyforge-ai/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: storyforge-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: storyforge-frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      # 단위 테스트는 화면 템플릿을 모두 컴파일하지 않으므로 빌드도 확인합니다 (docs/find_debug/2026-11-04.md).
      - run: npx ng build

  console:
    name: console (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: storyforge-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: storyforge-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
